server:
  port: 8083

spring:
  application:
    name: grievance-service

  # Removed database configuration as grievances come from external API
  # Only bookmarks service uses database

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"

# External Grievance API Configuration
grievance:
  api:
    base-url: http://localhost:3232/grievance
