spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # AUTH SERVICE (public)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**


        # USER REGISTER (public – no StripPrefix)
        - id: user-profile-service-register
          uri: lb://user-profile-service
          predicates:
            - Path=/users/register


        # USER SERVICE (secured)
        - id: user-profile-service
          uri: lb://user-profile-service
          predicates:
            - Path=/users/**
          filters:
            
            - JwtAuthFilter


        # GRIEVANCE SERVICE (secured)
        - id: grievance-service
          uri: lb://grievance-service
          predicates:
            - Path=/grievance/**
          filters:
            
            - JwtAuthFilter


        # BOOKMARK SERVICE (secured)
        - id: bookmark-service
          uri: lb://bookmark-service
          predicates:
            - Path=/bookmarks/**
          filters:
            
            - JwtAuthFilter


server:
  port: 8080


logging:
  level:
    org.springframework.boot.context.config: DEBUG


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    hostname: localhost


management:
  endpoints:
    web:
      exposure:
        include: "*"
